name: Deploy_Subnet_Calculator

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Create Backup on Netcup Server
      uses: appleboy/ssh-action@v1.2.0 
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          if [ -f /var/www/html/index.html ]; then
            cp /var/www/html/index.html /var/www/html/index_$(date +%Y%m%d_%H%M%S).html.bak
            fi

    - name: Copy index.html to Netcup Server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "index.html"
        target: "/var/www/html/"
